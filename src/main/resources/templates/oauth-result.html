<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат авторизации Google</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .success .icon {
            color: #4caf50;
        }
        
        .error .icon {
            color: #f44336;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .message {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        .button:hover {
            background: #5568d3;
        }
        
        .close-button {
            margin-top: 20px;
            padding: 8px 16px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .close-button:hover {
            background: #d0d0d0;
        }
    </style>
</head>
<body>
    <div class="container" th:classappend="${success} ? 'success' : 'error'">
        <div class="icon" th:text="${success} ? '✅' : '❌'"></div>
        <h1 th:text="${success} ? 'Авторизация успешна!' : 'Ошибка авторизации'"></h1>
        <p class="message" th:text="${message}"></p>
        <button class="close-button" onclick="window.close()">Закрыть окно</button>
    </div>
    
    <script>
        // Автоматически закрываем окно через 5 секунд при успехе
        if ([[${success}]]) {
            setTimeout(function() {
                window.close();
            }, 5000);
        }
    </script>
</body>
</html>
